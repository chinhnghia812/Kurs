[package]
name = "kurs-quote-registry-contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "27.0.2"

[dev-dependencies]
soroban-sdk = { version = "27.0.2", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
panic = "abort"
lto = true
codegen-units = 1
